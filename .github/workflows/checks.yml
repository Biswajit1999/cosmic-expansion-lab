name: Scientific and application checks
on: [push, pull_request]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests
      - run: node --check web/app.js
      - run: node --check web/research.js
      - run: node --check web/attractor.js
      - run: node --check web/observations.js
      - run: node --test tests/attractor-model.test.cjs
      - run: python analysis/validate_attractor.py --check
